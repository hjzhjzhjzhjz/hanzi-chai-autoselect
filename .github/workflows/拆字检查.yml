name: 拆字检查

# 在 GitHub Actions 云端跑 hanzi-chai 的拆分算法。
# 目的：验证指定汉字在某个方案下能否被拆出来、拆成哪些部件、得到什么编码。
#
# 手动触发：在 Actions 页点 "拆字检查" → Run workflow → 填参数
# 也支持 push 到 main 时自动跑一次默认检查。

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "方案名（examples/ 下的文件名，不带 .yaml）"
        required: true
        default: "easy"
      chars:
        description: "要拆的字，逗号分隔（留空则列出方案全部字）"
        required: false
        default: "㡀,敝,弊,蔽,憋,毙,瞥,撇"
      upload_result:
        description: "是否把 JSON 结果作为 artifact 上传"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "packages/hanzi-chai/**"
      - "examples/**"
      - "拆字.ts"
      - ".github/workflows/拆字检查.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  拆字:
    name: 拆分 ${{ inputs.scheme || 'easy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 下载字库数据
        run: bun run fetch

      - name: 运行拆分
        id: run_split
        run: |
          set -euo pipefail
          SCHEME="${{ inputs.scheme || 'easy' }}"
          CHARS="${{ inputs.chars }}"
          echo "方案: $SCHEME"
          echo "目标字: $CHARS"
          # 逗号分隔的字符列表转成空格分隔的参数
          ARGS=""
          if [ -n "$CHARS" ]; then
            ARGS=$(echo "$CHARS" | tr ',' ' ')
          fi
          bun run 拆字 "$SCHEME" $ARGS
          {
            echo "scheme<<EOF"
            echo "$SCHEME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 保存结果
        if: ${{ inputs.upload_result != false }}
        uses: actions/upload-artifact@v4
        with:
          name: 拆字结果-${{ github.run_number }}
          path: |
            拆字结果.json
            output-*/
          retention-days: 30
          if-no-files-found: warn
